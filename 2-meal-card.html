<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kombo kitchen</title>
    <link rel="stylesheet" href="2-meal-card.css">
</head>

<body>
    <main>
        <h1>Our Menu</h1>

        <div class="cards-wrapper">
            <div class="card">
                <img src="image.png" alt="Domoda atew with carrots and potatoes, besides a pot of white rice ">

                <h2>Domoda</h2>
                <p>Groundnut stew with meat and vegetable, and rice</p>
                <p class="price">D250</p>
                <button type="button">Order</button>
            </div>

            <div class="cards-wrapper">
                <div class="card">
                    <img src="image copy.png" alt="Domoda atew with carrots and potatoes, besides a pot of white rice ">

                    <h2>Jollof Rice</h2>
                    <p>one pot rice cooked in tomatoes and spices</p>
                    <p class="price">D250</p>
                    <button type="button">Order</button>
                </div>

            </div>

            <div class="cards-wrapper">
                <div class="card">
                    <img src="image copy 2.png"
                        alt="Domoda atew with carrots and potatoes, besides a pot of white rice ">

                    <h2>Chicken Yassa</h2>
                    <p>Chicken in lemon onion sauce with rice</p>
                    <p class="price">D250</p>
                    <button type="button">Order</button>
    </main>
</body>

</html>
